# AutoCare - Docker Compose Configuration
# Use this if PostgreSQL is available. Otherwise, the application
# falls back to SQLite (documented in README).

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autocare-db
    environment:
      POSTGRES_DB: autocare
      POSTGRES_USER: autocare_user
      POSTGRES_PASSWORD: autocare_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocare_user -d autocare"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
